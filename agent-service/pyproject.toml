[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-copilot-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "vanna[fastapi,postgres,openai,ollama]==2.0.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.9,<3",
  "httpx>=0.28,<1",
  "sqlglot>=26,<28",
  "psycopg[binary]>=3.2,<4",
  "pandas>=2.2,<3",
  "sentence-transformers==3.4.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
